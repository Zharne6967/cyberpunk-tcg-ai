<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyberpunk TCG AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0e'/><path d='M7 9h18l-4 7h-7l-3 7H7z' fill='%23fcee0a'/></svg>" />
<style>
  :root { --y: #f5e600; --c: #00f0ff; --m: #ff2a6d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #050506; color: #ececf2; font: 16px/1.4 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
  .box { width: min(460px, 100%); border: 1px solid #f5e600aa; padding: 28px 24px; clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); background: #000; }
  h1 { margin: 0 0 18px; font-size: 26px; letter-spacing: .08em; color: var(--y); }
  h1 span { color: var(--c); }
  .bar { height: 6px; background: #f5e60022; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 -40%; width: 40%; background: var(--y); animation: run 1.2s ease-in-out infinite; }
  @keyframes run { to { left: 100%; } }
  .status { margin: 14px 0 4px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--y); }
  .small { font-size: 13px; color: #8a8a9c; }
  .err { color: var(--m); }
  button { margin-top: 14px; background: var(--y); color: #000; border: 0; font: 800 14px "Segoe UI", sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>CYBERPUNK <span>TCG</span> // AI</h1>
  <div class="bar" id="bar"><i></i></div>
  <div class="status" id="status">Starting the game server</div>
  <div class="small" id="info">The free server sleeps when nobody plays. The first start takes up to a minute.</div>
  <button id="retry" hidden>Try again</button>
</div>
<script src="config.js"></script>
<script>
  // Wake the sleeping game server, then continue there (room links keep their #/join/… part).
  const server = (window.CPAI_SERVER || "").replace(/\/+$/, "");
  const status = document.getElementById("status");
  const info = document.getElementById("info");
  const retry = document.getElementById("retry");
  const bar = document.getElementById("bar");
  let started = Date.now();
  let stopped = false;

  async function ping() {
    try {
      const r = await fetch(server + "/api/health", { cache: "no-store" });
      return r.ok;
    } catch {
      return false;
    }
  }
  async function loop() {
    if (!server) {
      status.textContent = "Not configured";
      status.className = "status err";
      info.textContent = "The server address is missing (config.js).";
      bar.hidden = true;
      return;
    }
    while (!stopped) {
      if (await ping()) {
        status.textContent = "Ready";
        location.replace(server + "/" + location.hash);
        return;
      }
      const s = Math.round((Date.now() - started) / 1000);
      status.textContent = "Starting the game server · " + s + " s";
      if (s > 180) {
        stopped = true;
        status.textContent = "The server did not start";
        status.className = "status err";
        bar.hidden = true;
        retry.hidden = false;
        return;
      }
      await new Promise((r) => setTimeout(r, 2000));
    }
  }
  retry.onclick = () => {
    stopped = false;
    started = Date.now();
    status.className = "status";
    bar.hidden = false;
    retry.hidden = true;
    loop();
  };
  loop();
</script>
</body>
</html>
